# Cole este arquivo em: .github/workflows/snake.yml
# no repositório ailtonmcneto/ailtonmcneto

name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"   # todo dia à meia-noite UTC
  workflow_dispatch:        # permite rodar manualmente pela aba Actions

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=7dd3fc&color_dots=#0d1117,#1e3a5f,#2563eb,#3b82f6,#7dd3fc
            dist/github-contribution-grid-snake-dark.svg?color_snake=7dd3fc&color_dots=#0d1117,#1e3a5f,#2563eb,#3b82f6,#7dd3fc&palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push SVGs to branch output
        run: |
          cd dist
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b output
          git add .
          git commit -m "ci: update snake animation [skip ci]"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" output
